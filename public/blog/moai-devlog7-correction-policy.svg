<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Correction policy by gameplay context</title>
  <desc id="desc">Local player, remote player, and critical combat event use different correction policies.</desc>
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#84cc16"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fb4566"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1120" height="520" rx="28" fill="#070b16"/>
  <path d="M0 80H1120M0 160H1120M0 240H1120M0 320H1120M0 400H1120M0 480H1120M112 0V520M224 0V520M336 0V520M448 0V520M560 0V520M672 0V520M784 0V520M896 0V520M1008 0V520" stroke="#17233d" stroke-width="1"/>

  <text x="64" y="64" fill="#f8fafc" font-family="Arial, sans-serif" font-size="32" font-weight="700">스냅샷 보정은 상황별로 다르게 적용</text>
  <text x="64" y="102" fill="#a9b4c8" font-family="Arial, sans-serif" font-size="20">서버 좌표는 정답이지만, 모든 좌표를 같은 방식으로 화면에 복사하면 손맛이 깨졌습니다.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="74" y="164" width="286" height="214" rx="18" fill="#0b1526" stroke="#22d3ee" stroke-width="3"/>
    <rect x="417" y="164" width="286" height="214" rx="18" fill="#111827" stroke="#84cc16" stroke-width="3"/>
    <rect x="760" y="164" width="286" height="214" rx="18" fill="#1c1020" stroke="#fb4566" stroke-width="3"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="108" y="210" fill="#22d3ee" font-size="22" font-weight="700">Local Player</text>
    <text x="108" y="250" fill="#f8fafc" font-size="28" font-weight="700">즉시 반응</text>
    <text x="108" y="290" fill="#a9b4c8" font-size="19">내 입력은 먼저 화면에 반영합니다.</text>
    <text x="108" y="322" fill="#a9b4c8" font-size="19">작은 오차만 짧게 흡수합니다.</text>
    <path d="M118 352 H318" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>

    <text x="451" y="210" fill="#84cc16" font-size="22" font-weight="700">Remote Player</text>
    <text x="451" y="250" fill="#f8fafc" font-size="28" font-weight="700">짧은 완충</text>
    <text x="451" y="290" fill="#a9b4c8" font-size="19">상대 캐릭터의 큰 vertical snap만</text>
    <text x="451" y="322" fill="#a9b4c8" font-size="19">3~4프레임 안에서 줄입니다.</text>
    <path d="M461 352 C520 320 600 320 660 352" fill="none" stroke="#84cc16" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-green)"/>

    <text x="794" y="210" fill="#fb4566" font-size="22" font-weight="700">Critical Event</text>
    <text x="794" y="250" fill="#f8fafc" font-size="28" font-weight="700">즉시 확정</text>
    <text x="794" y="290" fill="#a9b4c8" font-size="19">피격, 사망, 구조, 결과는</text>
    <text x="794" y="322" fill="#a9b4c8" font-size="19">늦추지 않고 바로 보여줍니다.</text>
    <path d="M804 352 H1004" stroke="#fb4566" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-pink)"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="220" y="420" width="680" height="50" rx="25" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="260" y="453" fill="#e2e8f0" font-size="21" font-weight="700">목표: 판정은 최신 서버값, 화면은 플레이어가 납득할 만큼만 보정</text>
  </g>
</svg>
