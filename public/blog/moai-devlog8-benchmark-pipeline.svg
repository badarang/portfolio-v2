<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark bottleneck finder</title>
  <desc id="desc">A simple animated diagram showing benchmark scenarios revealing different bottlenecks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111528"/>
    </linearGradient>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.82 0 0 0 0 0.93 0 0 0 0.42 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { fill: #f8fafc; font: 900 38px Pretendard, "Noto Sans KR", Arial, sans-serif; letter-spacing: 0; }
      .sub { fill: #aab6cf; font: 700 18px Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .nodeTitle { fill: #f8fafc; font: 900 19px Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .nodeSub { fill: #9fb0ca; font: 700 14px Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .badge { font: 900 17px Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .small { fill: #c7d2fe; font: 800 15px Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .caption { fill: #dbeafe; font: 900 20px Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .muted { fill: #93a4c0; font: 700 14px Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .flow { stroke: #334155; stroke-width: 5; stroke-linecap: round; }
      .scan { stroke: #22d3ee; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 92 620; animation: scan 5.5s linear infinite; filter: url(#cyanGlow); }
      .pulse1 { animation: pulse 5.5s ease-in-out infinite; animation-delay: 0.4s; }
      .pulse2 { animation: pulse 5.5s ease-in-out infinite; animation-delay: 1.8s; }
      .pulse3 { animation: pulse 5.5s ease-in-out infinite; animation-delay: 3.2s; }
      .pulse4 { animation: pulse 5.5s ease-in-out infinite; animation-delay: 4.4s; }
      @keyframes scan {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -712; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.86; filter: none; }
        15%, 30% { opacity: 1; filter: url(#cyanGlow); }
      }
      @media (prefers-reduced-motion: reduce) {
        .scan, .pulse1, .pulse2, .pulse3, .pulse4 { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <g opacity="0.13" stroke="#5b6f99" stroke-width="1">
    <path d="M100 0 V560M220 0 V560M340 0 V560M460 0 V560M580 0 V560M700 0 V560M820 0 V560M940 0 V560M1060 0 V560"/>
    <path d="M0 95 H1200M0 215 H1200M0 335 H1200M0 455 H1200"/>
  </g>

  <text class="title" x="76" y="72">같은 서버, 다른 시나리오, 다른 병목</text>
  <text class="sub" x="76" y="104">벤치마크는 “서버가 느리다”를 실패 위치로 쪼개는 도구였습니다.</text>

  <path class="flow" d="M168 290 H1032"/>
  <path class="scan" d="M168 290 H1032"/>

  <g class="pulse1" transform="translate(76 206)">
    <rect width="190" height="168" rx="24" fill="#101827" stroke="#22d3ee" stroke-width="3"/>
    <text class="nodeTitle" x="95" y="48" text-anchor="middle">정상 테스트</text>
    <text class="nodeSub" x="95" y="82" text-anchor="middle">연결 / 매칭 / 저장</text>
    <rect x="38" y="108" width="114" height="34" rx="17" fill="#122d25" stroke="#86efac" stroke-width="2"/>
    <text class="badge" x="95" y="131" text-anchor="middle" fill="#86efac">PASS</text>
  </g>

  <g class="pulse2" transform="translate(342 206)">
    <rect width="190" height="168" rx="24" fill="#101827" stroke="#fb7185" stroke-width="3"/>
    <text class="nodeTitle" x="95" y="48" text-anchor="middle">Auth 병목</text>
    <text class="nodeSub" x="95" y="82" text-anchor="middle">신규 유저 생성</text>
    <rect x="25" y="108" width="140" height="34" rx="17" fill="#2a0f16" stroke="#fb7185" stroke-width="2"/>
    <text class="badge" x="95" y="131" text-anchor="middle" fill="#fb7185">WELCOME</text>
  </g>

  <g class="pulse3" transform="translate(608 206)">
    <rect width="190" height="168" rx="24" fill="#101827" stroke="#facc15" stroke-width="3"/>
    <text class="nodeTitle" x="95" y="48" text-anchor="middle">매칭 병목</text>
    <text class="nodeSub" x="95" y="82" text-anchor="middle">큐 / 방 생성</text>
    <rect x="42" y="108" width="106" height="34" rx="17" fill="#2b2108" stroke="#facc15" stroke-width="2"/>
    <text class="badge" x="95" y="131" text-anchor="middle" fill="#facc15">MATCH</text>
  </g>

  <g class="pulse4" transform="translate(874 206)">
    <rect width="190" height="168" rx="24" fill="#101827" stroke="#a78bfa" stroke-width="3"/>
    <text class="nodeTitle" x="95" y="48" text-anchor="middle">저장 병목</text>
    <text class="nodeSub" x="95" y="82" text-anchor="middle">경기 종료 이후</text>
    <rect x="42" y="108" width="106" height="34" rx="17" fill="#201330" stroke="#a78bfa" stroke-width="2"/>
    <text class="badge" x="95" y="131" text-anchor="middle" fill="#c4b5fd">RESULT</text>
  </g>

  <g transform="translate(154 432)">
    <rect width="892" height="56" rx="18" fill="#0e1726" stroke="#334155" stroke-width="2"/>
    <text class="caption" x="446" y="36" text-anchor="middle">핵심: 성공률 하나가 아니라, 실패가 시작된 단계를 기록해야 고칠 수 있었습니다.</text>
  </g>
  <text class="muted" x="600" y="526" text-anchor="middle">CONN이 100%여도 WELCOME, MATCH, RESULT는 따로 무너질 수 있습니다.</text>
</svg>
