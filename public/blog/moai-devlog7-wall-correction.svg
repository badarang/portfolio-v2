<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">State transition correction</title>
  <desc id="desc">Small position differences are easy to notice during landing and wall contact state changes.</desc>
  <defs>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fb4566"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1120" height="520" rx="28" fill="#070b16"/>
  <path d="M0 80H1120M0 160H1120M0 240H1120M0 320H1120M0 400H1120M0 480H1120M112 0V520M224 0V520M336 0V520M448 0V520M560 0V520M672 0V520M784 0V520M896 0V520M1008 0V520" stroke="#17233d" stroke-width="1"/>

  <text x="64" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="31" font-weight="700">상태가 바뀌는 순간에 보정이 더 잘 보였다</text>
  <text x="64" y="100" fill="#a9b4c8" font-family="Arial, sans-serif" font-size="20">공중 이동 중에는 작은 오차가 흐려지지만, 착지와 벽 접촉 순간에는 바로 눈에 들어왔습니다.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="146" width="442" height="300" rx="18" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <rect x="602" y="146" width="442" height="300" rx="18" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="108" y="190" fill="#e2e8f0" font-size="24" font-weight="700">공중 예측 중</text>
    <text x="634" y="190" fill="#e2e8f0" font-size="24" font-weight="700">착지/벽 접촉 순간</text>
    <text x="108" y="420" fill="#94a3b8" font-size="18">작은 좌표 차이가 이동 흐름 안에 묻힘</text>
    <text x="634" y="420" fill="#94a3b8" font-size="18">상태가 바뀌는 순간에는 보정 방향이 바로 보임</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 346 H482" stroke="#f8fafc" stroke-width="8"/>
    <path d="M148 320 C214 230 316 216 430 272" stroke="#fb4566" stroke-width="6" marker-end="url(#arrow-pink)"/>
    <path d="M148 322 C218 246 322 236 430 286" stroke="#22d3ee" stroke-width="5" stroke-dasharray="12 12"/>
    <circle cx="210" cy="260" r="22" fill="#0b1220" stroke="#fb4566" stroke-width="7"/>
    <circle cx="328" cy="236" r="18" fill="#0b1220" stroke="#22d3ee" stroke-width="6"/>
    <rect x="252" y="296" width="158" height="34" rx="17" fill="#3a101c"/>
    <text x="274" y="319" fill="#fecdd3" font-family="Arial, sans-serif" font-size="18" font-weight="700">오차가 덜 보임</text>

    <path d="M652 346 H1016" stroke="#f8fafc" stroke-width="8"/>
    <path d="M996 168 V346" stroke="#f8fafc" stroke-width="8"/>
    <path d="M694 258 C782 234 870 252 948 318" stroke="#fb4566" stroke-width="6" marker-end="url(#arrow-pink)"/>
    <path d="M948 318 C920 338 884 348 844 346" stroke="#22d3ee" stroke-width="6" marker-end="url(#arrow-cyan)"/>
    <circle cx="948" cy="318" r="22" fill="#0b1220" stroke="#fb4566" stroke-width="7"/>
    <circle cx="844" cy="346" r="18" fill="#0b1220" stroke="#22d3ee" stroke-width="6"/>
    <rect x="742" y="278" width="166" height="34" rx="17" fill="#123345"/>
    <text x="764" y="301" fill="#cffafe" font-family="Arial, sans-serif" font-size="18" font-weight="700">짧은 pullback</text>
  </g>
</svg>
