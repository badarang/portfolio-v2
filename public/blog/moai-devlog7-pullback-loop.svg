<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Pullback correction flow</title>
  <desc id="desc">Client prediction moves forward, then server correction pulls the character back before it reaches the final position.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f8fafc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb4566"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1120" height="560" rx="28" fill="#070b16"/>
  <path d="M0 84H1120M0 168H1120M0 252H1120M0 336H1120M0 420H1120M0 504H1120M112 0V560M224 0V560M336 0V560M448 0V560M560 0V560M672 0V560M784 0V560M896 0V560M1008 0V560" stroke="#17233d" stroke-width="1"/>
  <text x="64" y="64" fill="#f8fafc" font-family="Arial, sans-serif" font-size="32" font-weight="700">Pullback: 빠른 입력 반응 뒤에 보이는 되감김</text>
  <text x="64" y="102" fill="#a9b4c8" font-family="Arial, sans-serif" font-size="20">클라이언트 예측은 손맛을 살리지만, 서버 보정이 자주 들어오면 중간 위치로 끌려가는 느낌이 남습니다.</text>

  <g filter="url(#soft-shadow)" font-family="Arial, sans-serif">
    <rect x="96" y="348" width="122" height="92" rx="8" fill="#101827" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="92" cy="314" r="24" fill="#070b16" stroke="#f8fafc" stroke-width="5"/>
    <text x="85" y="323" fill="#f8fafc" font-size="27" font-weight="700">1</text>
    <text x="78" y="478" fill="#cbd5e1" font-size="18">입력 시작</text>

    <rect x="460" y="172" width="122" height="92" rx="8" fill="#101827" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="506" cy="138" r="24" fill="#070b16" stroke="#f8fafc" stroke-width="5"/>
    <text x="499" y="147" fill="#f8fafc" font-size="27" font-weight="700">2</text>

    <rect x="452" y="316" width="122" height="92" rx="8" fill="#210b13" stroke="#fb4566" stroke-width="5"/>
    <circle cx="430" cy="382" r="24" fill="#070b16" stroke="#f8fafc" stroke-width="5"/>
    <text x="423" y="391" fill="#f8fafc" font-size="27" font-weight="700">3</text>
    <text x="405" y="444" fill="#fda4af" font-size="18">서버 보정</text>

    <rect x="830" y="118" width="128" height="96" rx="8" fill="#0c2116" stroke="#22c55e" stroke-width="5"/>
    <circle cx="1018" cy="176" r="36" fill="#070b16" stroke="#f8fafc" stroke-width="5"/>
    <text x="1008" y="187" fill="#f8fafc" font-size="30" font-weight="700">4</text>
    <text x="808" y="248" fill="#bbf7d0" font-size="18">도착 기대 위치</text>
  </g>

  <path d="M200 340 C264 270 346 206 452 184" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-dark)"/>
  <path d="M548 314 C620 246 704 190 826 148" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <path d="M568 304 C544 326 516 340 484 344" fill="none" stroke="#fb4566" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-red)"/>

  <g font-family="Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="255" y="206" width="128" height="36" rx="18" fill="#1e293b"/>
    <text x="278" y="231" fill="#f8fafc">예측 이동</text>
    <rect x="594" y="186" width="158" height="36" rx="18" fill="#12351f"/>
    <text x="617" y="211" fill="#bbf7d0">원래 가고 싶던 곳</text>
    <rect x="424" y="262" width="150" height="36" rx="18" fill="#3a101c"/>
    <text x="445" y="287" fill="#fecdd3">뒤로 당겨짐</text>
  </g>
</svg>
